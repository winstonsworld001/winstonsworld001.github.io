<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winston's World</title>
<style>
  :root { --bg: #fdf6ec; --ink: #3b3049; --muted: #6d6380; --accent: #ff9e9e; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1a26; --ink: #f1ecf7; --muted: #b6abc6; --accent: #ff9e9e; --card: #2a2433; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 32px 0 8px; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 22px; }
  .date { color: var(--muted); margin-bottom: 24px; }
  .summary { background: var(--card); border-left: 5px solid var(--accent);
    border-radius: 12px; padding: 16px 18px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
<h1>Winston's World</h1>
<p class="date">Small puzzle games for iPhone</p>

<h2>Tumblio</h2>
<p>Roll a block across floating tiles and stand it up in the hole.</p>
<ul>
  <li><a href="tumblio/support.html">Support</a></li>
  <li><a href="tumblio/privacy.html">Privacy policy</a></li>
</ul>

<h2>Contact</h2>
<p><a href="mailto:winstonsworld001@gmail.com">winstonsworld001@gmail.com</a></p>

</main>
</body>
</html>
